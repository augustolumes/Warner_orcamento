<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, 'Helvetica Neue', sans-serif;
      background: #f8f6f1;
      color: #1a1a18;
      min-height: 100vh;
    }

    :root {
      --green-dark: #2d5a3d;
      --green-mid: #4a7c5e;
      --green-light: #e8f0ea;
      --gold: #b8975a;
      --gold-light: #f5edd8;
      --cream: #faf8f3;
      --border: rgba(45, 90, 61, 0.15);
      --border-strong: rgba(45, 90, 61, 0.3);
      --text-primary: #1a1a18;
      --text-secondary: #5a5a52;
      --text-muted: #8a8a80;
      --radius: 12px;
      --shadow: 0 2px 12px rgba(45, 90, 61, 0.08);
    }

    .app {
      max-width: 430px;
      margin: 0 auto;
      padding-bottom: 100px;
    }

    /* Header */
    .header {
      background: var(--green-dark);
      padding: 20px 20px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
    }

    .logo-wrap {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .logo-wrap img {
      width: 38px;
      height: 38px;
      object-fit: contain;
    }

    .logo-letter {
      font-size: 20px;
      font-weight: 700;
      color: var(--green-dark);
    }

    .header-title {
      flex: 1;
    }

    .header-title h1 {
      font-size: 16px;
      font-weight: 600;
      color: white;
      letter-spacing: 0.5px;
    }

    .header-title p {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 2px;
    }

    /* Steps nav */
    .steps-nav {
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
      gap: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .steps-nav::-webkit-scrollbar {
      display: none;
    }

    .step-tab {
      flex-shrink: 0;
      padding: 10px 16px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.55);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: all 0.2s;
      font-weight: 500;
    }

    .step-tab.active {
      color: white;
      border-bottom-color: var(--gold);
    }

    .step-tab.done {
      color: rgba(255, 255, 255, 0.75);
    }

    /* Content */
    .content {
      padding: 16px;
    }

    .section {
      background: white;
      border-radius: var(--radius);
      border: 0.5px solid var(--border);
      margin-bottom: 12px;
      overflow: hidden;
    }

    .section-header {
      padding: 14px 16px 12px;
      border-bottom: 0.5px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--green-light);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .section-icon svg {
      width: 15px;
      height: 15px;
      color: var(--green-dark);
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--green-dark);
      letter-spacing: 0.3px;
    }

    .section-body {
      padding: 14px 16px;
    }

    /* Fields */
    .field {
      margin-bottom: 14px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
      display: block;
    }

    .field-input {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      border: 0.5px solid var(--border-strong);
      border-radius: 8px;
      background: var(--cream);
      color: var(--text-primary);
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    .field-input:focus {
      border-color: var(--green-mid);
      background: white;
    }

    .field-input::placeholder {
      color: var(--text-muted);
      font-size: 14px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field-row-3 {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 8px;
    }

    select.field-input {
      cursor: pointer;
    }

    textarea.field-input {
      resize: none;
      min-height: 70px;
      font-size: 14px;
    }

    /* Products */
    .product-item {
      background: var(--cream);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      border: 0.5px solid var(--border);
      position: relative;
    }

    .product-remove {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      color: #c0392b;
      opacity: 0.6;
      font-size: 18px;
      padding: 2px;
      line-height: 1;
    }

    .product-remove:hover {
      opacity: 1;
    }

    .product-name-row {
      margin-bottom: 8px;
    }

    .add-btn {
      width: 100%;
      padding: 11px;
      border: 1px dashed var(--green-mid);
      border-radius: 8px;
      background: transparent;
      color: var(--green-mid);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .add-btn svg {
      width: 18px;
      height: 18px;
    }

    .add-btn:hover {
      background: var(--green-light);
    }

    /* Frete */
    .frete-result {
      background: var(--gold-light);
      border: 0.5px solid rgba(184, 151, 90, 0.4);
      border-radius: 10px;
      padding: 14px;
      margin-top: 14px;
    }

    .frete-result-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 4px;
    }

    .frete-result-value {
      font-size: 22px;
      font-weight: 700;
      color: #7a5e20;
    }

    .frete-dist {
      font-size: 12px;
      color: #9a7a40;
      margin-top: 2px;
    }

    .calc-btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: var(--green-mid);
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s;
      margin-top: 12px;
    }

    .calc-btn:hover {
      background: var(--green-dark);
    }

    .calc-btn:active {
      transform: scale(0.98);
    }

    .loading-btn {
      opacity: 0.7;
      pointer-events: none;
    }

    /* Resumo */
    .resumo-card {
      background: white;
      border-radius: var(--radius);
      border: 0.5px solid var(--border);
      overflow: hidden;
      margin-bottom: 12px;
    }

    .resumo-header {
      background: var(--green-dark);
      padding: 16px;
    }

    .resumo-header h2 {
      font-size: 15px;
      font-weight: 600;
      color: white;
    }

    .resumo-header p {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 3px;
    }

    .resumo-body {
      padding: 14px 16px;
    }

    .resumo-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 0.5px solid var(--border);
      font-size: 14px;
    }

    .resumo-row:last-child {
      border-bottom: none;
    }

    .resumo-row label {
      color: var(--text-secondary);
    }

    .resumo-row span {
      font-weight: 500;
      color: var(--text-primary);
    }

    .resumo-total {
      background: var(--green-dark);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .resumo-total label {
      color: rgba(255, 255, 255, 0.75);
      font-size: 13px;
      font-weight: 500;
    }

    .resumo-total span {
      color: white;
      font-size: 22px;
      font-weight: 700;
    }

    .items-list {
      margin: 8px 0;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 0.5px solid var(--border);
      font-size: 13px;
    }

    .item-row:last-child {
      border-bottom: none;
    }

    /* Action buttons */
    .actions {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 0.5px solid var(--border);
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      max-width: 430px;
      margin: 0 auto;
      z-index: 200;
    }

    .actions {
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
    }

    .action-btn {
      flex: 1;
      padding: 13px 10px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    .btn-whats {
      background: #25D366;
      color: white;
    }

    .btn-whats:hover {
      background: #1da84f;
    }

    .btn-pdf {
      background: var(--green-dark);
      color: white;
    }

    .btn-pdf:hover {
      background: #1e3d29;
    }

    .btn-nav {
      background: var(--green-mid);
      color: white;
    }

    .btn-nav-prev {
      background: white;
      color: var(--green-dark);
      border: 1px solid var(--border-strong);
    }

    /* Tag/badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-green {
      background: var(--green-light);
      color: var(--green-dark);
    }

    /* Tip box */
    .tip {
      background: var(--gold-light);
      border-left: 3px solid var(--gold);
      border-radius: 0 8px 8px 0;
      padding: 10px 12px;
      margin-top: 12px;
      font-size: 12px;
      color: #7a5e20;
      line-height: 1.5;
    }

    /* Copied toast */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--green-dark);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
    }

    /* PDF Modal */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      display: flex;
      align-items: flex-end;
      padding: 0;
    }

    .modal {
      background: white;
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px 16px 40px;
    }

    .modal-handle {
      width: 36px;
      height: 4px;
      background: var(--border-strong);
      border-radius: 4px;
      margin: 0 auto 16px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--green-dark);
      text-align: center;
      margin-bottom: 4px;
    }

    .modal-sub {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 20px;
    }

    .hidden {
      display: none !important;
    }

    /* PDF Preview */
    #pdf-preview {
      background: white;
      padding: 20px;
      font-size: 12px;
      color: #222;
    }

    .pdf-logo-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--green-dark);
      padding-bottom: 12px;
    }

    .pdf-logo {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      color: var(--green-dark);
      flex-shrink: 0;
    }

    .pdf-empresa h2 {
      font-size: 14px;
      font-weight: 700;
      color: var(--green-dark);
    }

    .pdf-empresa p {
      font-size: 10px;
      color: #555;
      line-height: 1.6;
    }

    .pdf-num-row {
      display: flex;
      justify-content: space-between;
      background: #f5f5f0;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 14px;
      font-size: 11px;
      font-weight: 600;
      color: #444;
    }

    .pdf-section-title {
      background: var(--green-dark);
      color: white;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      border-radius: 4px;
      margin: 10px 0 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .pdf-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    .pdf-table th {
      background: #eee;
      padding: 5px 8px;
      text-align: left;
      font-weight: 600;
      font-size: 10px;
      color: #444;
    }

    .pdf-table td {
      padding: 5px 8px;
      border-bottom: 0.5px solid #e5e5e0;
    }

    .pdf-table tr:nth-child(even) td {
      background: #fafaf5;
    }

    .pdf-totals {
      margin-top: 10px;
      background: #f5f5f0;
      border-radius: 6px;
      padding: 8px 12px;
    }

    .pdf-total-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      padding: 3px 0;
    }

    .pdf-total-final {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 700;
      color: var(--green-dark);
      padding: 6px 0 0;
      border-top: 1.5px solid var(--green-dark);
      margin-top: 4px;
    }

    .pdf-obs {
      background: #f9f9f4;
      border: 0.5px solid #ddd;
      border-radius: 6px;
      padding: 8px 12px;
      margin-top: 10px;
      font-size: 11px;
      line-height: 1.6;
    }

    .pdf-assinaturas {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
    }

    .pdf-ass {
      text-align: center;
      width: 40%;
    }

    .pdf-ass-line {
      border-top: 1px solid #333;
      padding-top: 4px;
      font-size: 10px;
      color: #555;
    }

    .num-input {
      text-align: right;
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- Header -->
    <div class="header">
      <div class="header-top">
        <div class="logo-wrap">
          <span class="logo-letter">W</span>
        </div>
        <div class="header-title">
          <h1>Warner Flores</h1>
          <p>Gerador de orçamentos</p>
        </div>
      </div>
      <div class="steps-nav" id="steps-nav">
        <div class="step-tab active" data-step="0">👤 Cliente</div>
        <div class="step-tab" data-step="1">📅 Evento</div>
        <div class="step-tab" data-step="2">🌸 Pedido</div>
        <div class="step-tab" data-step="3">🚗 Frete</div>
        <div class="step-tab" data-step="4">💳 Pagamento</div>
        <div class="step-tab" data-step="5">📋 Resumo</div>
      </div>
    </div>

    <div class="content" id="main-content">
      <!-- Steps rendered by JS -->
    </div>

    <!-- Bottom navigation -->
    <div class="actions" id="bottom-actions">
      <button class="action-btn btn-nav-prev" id="btn-prev" style="display:none">← Voltar</button>
      <button class="action-btn btn-nav" id="btn-next">Próximo →</button>
    </div>

  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- PDF Modal -->
  <div class="modal-bg hidden" id="pdf-modal">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title">📄 Orçamento PDF</div>
      <div class="modal-sub">Visualize e baixe o orçamento formatado</div>
      <div id="pdf-preview"></div>
      <div style="display:flex;gap:10px;margin-top:16px;">
        <button class="action-btn btn-nav-prev" style="flex:1"
          onclick="document.getElementById('pdf-modal').classList.add('hidden')">Fechar</button>
        <button class="action-btn btn-pdf" style="flex:1" onclick="printPDF()">🖨️ Imprimir / Salvar</button>
      </div>
    </div>
  </div>

  <script>
    const state = {
      step: 0,
      cliente: { nome: '', cpf: '', whatsapp: '', endereco: '' },
      evento: { endereco: '', data: '', hora: '', duracao: '' },
      produtos: [{ id: 1, nome: '', valorUnit: 0, qtd: 1, obs: '' }],
      frete: {
        custo: 1.59,
        margemPct: 25,
        minimo: 10,
        distanciaKm: 0,
        valorFrete: 0,
        calcStatus: ''
      },
      pagamento: { metodo: 'PIX', taxaPct: 0, incluirFrete: true },
      numOrc: gerarNumOrc()
    };

    function gerarNumOrc() {
      const d = new Date();
      return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}${Math.floor(Math.random() * 100)}`;
    }

    const steps = ['cliente', 'evento', 'pedido', 'frete', 'pagamento', 'resumo'];

    /* ---- Icon SVGs ---- */
    const icons = {
      user: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>`,
      calendar: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`,
      flower: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="5"  rx="2.2" ry="4" stroke="currentColor"/>
    <ellipse cx="12" cy="5"  rx="2.2" ry="4" stroke="currentColor" transform="rotate(60 12 12)"/>
    <ellipse cx="12" cy="5"  rx="2.2" ry="4" stroke="currentColor" transform="rotate(120 12 12)"/>
    <ellipse cx="12" cy="5"  rx="2.2" ry="4" stroke="currentColor" transform="rotate(180 12 12)"/>
    <ellipse cx="12" cy="5"  rx="2.2" ry="4" stroke="currentColor" transform="rotate(240 12 12)"/>
    <ellipse cx="12" cy="5"  rx="2.2" ry="4" stroke="currentColor" transform="rotate(300 12 12)"/>
    <circle  cx="12" cy="12" r="2.8" fill="currentColor" opacity="0.2" stroke="currentColor"/>
    <line x1="12" y1="10.2" x2="12" y2="13.8" stroke="currentColor" stroke-width="1.2"/>
    <line x1="10.4" y1="12" x2="13.6" y2="12" stroke="currentColor" stroke-width="1.2"/>
  </svg>`,
      truck: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 3h15v13H1z"/><path d="M16 8h5l2 5v4h-7V8zM5.5 20a2.5 2.5 0 100-5 2.5 2.5 0 000 5zM18.5 20a2.5 2.5 0 100-5 2.5 2.5 0 000 5z"/></svg>`,
      card: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>`,
      doc: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>`,
      plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>`
    };

    function sectionIcon(name) {
      return `<div class="section-icon">${icons[name] || ''}</div>`;
    }

    /* ---- Calcs ---- */
    function subtotalProdutos() {
      return state.produtos.reduce((s, p) => s + (parseFloat(p.valorUnit) || 0) * (parseInt(p.qtd) || 0), 0);
    }
    function calcFrete() {
      const { custo, margemPct, minimo, distanciaKm } = state.frete;
      const custoTotal = custo * distanciaKm;
      const margem = (margemPct || 0) / 100;
      const frete = margem >= 1 ? custoTotal : Math.max(parseFloat(minimo) || 0, custoTotal / (1 - margem));
      return frete;
    }
    function valorFinal() {
      const sub = subtotalProdutos();

    /* ---- Attach listeners ---- */
    function attachListeners() {

            renderStep();
          });

      }
      // Frete
      if (state.step === 3) {
        const updateFreteCalc = () => {
          calcularFreteManual();
          const box = document.getElementById('frete-result-box');
          const val = document.getElementById('frete-result-val');
          if (box && val) {
            box.style.display = state.frete.distanciaKm > 0 ? 'block' : 'none';
            val.textContent = fmt(state.frete.valorFrete || 0);
          }

        bind('fr-custo', v => { state.frete.custo = parseFloat(v) || 1.59; updateFreteCalc(); });
        bind('fr-margem', v => { state.frete.margemPct = parseFloat(v) || 25; updateFreteCalc(); });
        bind('fr-min', v => { state.frete.minimo = parseFloat(v) || 10; updateFreteCalc(); });
        bind('fr-dist', v => { state.frete.distanciaKm = parseFloat(v) || 0; updateFreteCalc(); });
        
        const calcBtn = document.getElementById('calc-frete-btn');
        if (calcBtn) calcBtn.addEventListener('click', calcFreteAPI);

      // Pagamento
      if (state.step === 4) {
        bind('pg-metodo', v => { state.pagamento.metodo = v; renderStep(); });
        bind('pg-taxa', v => { state.pagamento.taxaPct = parseFloat(v) || 0; renderStep(); });
        const freteCb = document.getElementById('pg-frete');
        if (freteCb) freteCb.addEventListener('change', e => { state.pagamento.incluirFrete = e.target.checked; renderStep(); });

    function bind(id, fn) {
      const el = document.getElementById(id);
      if (el) el.addEventListener('input', e => fn(e.target.value));
    }

    function updateSubtotal() {
      const el = document.querySelector('.section:last-child .section-body span:last-child');
      if (el) el.textContent = fmt(subtotalProdutos());
    }

    function calcularFreteManual() {
      const fr = state.frete;
      const distKm = fr.distanciaKm || 0;
      if (distKm > 0) {
        const frete = Math.max(
          fr.minimo || 10,
          (fr.custo || 1.59) * distKm / (1 - (fr.margemPct || 25) / 100)
        );
        fr.valorFrete = parseFloat(frete.toFixed(2));
      } else {
        fr.valorFrete = 0;
      }
    }

    /* ---- Frete API (OpenStreetMap + OSRM) ---- */
    async function calcFreteAPI() {
      if (!state.evento.endereco) {
        showToast('⚠️ Informe o endereço do evento primeiro');
        return;
      }
      const btn = document.getElementById('calc-frete-btn');
      btn.textContent = '⏳ Calculando...';
      btn.classList.add('loading-btn');

      const origem = 'Av. André Avelino da Silva, 145, Jardim Esperança, Arapiraca, AL';
      const destino = state.evento.endereco;

      try {
        // Passo 1: Converter endereços em Coordenadas (Geocoding via Nominatim)
        const fetchCoords = async (address) => {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(address)}&format=json&limit=1&email=contato@warnerflores.com`);
          if (!res.ok) throw new Error('Erro ao buscar coordenadas');
          const data = await res.json();
          if (!data || data.length === 0) return null;
          return { lat: data[0].lat, lon: data[0].lon };
        };

        const coordOrigem = await fetchCoords(origem);
        const coordDestino = await fetchCoords(destino);

        if (!coordOrigem || !coordDestino) {
          throw new Error('Não foi possível localizar os endereços no mapa. Verifique se estão corretos.');
        }

        // Passo 2: Calcular a Rota (Routing via OSRM)
        const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coordOrigem.lon},${coordOrigem.lat};${coordDestino.lon},${coordDestino.lat}?overview=false`;
        const resRota = await fetch(osrmUrl);
        
        if (!resRota.ok) throw new Error('Erro ao calcular a rota');
        
        const dataRota = await resRota.json();

        if (dataRota && dataRota.routes && dataRota.routes.length > 0) {
          const distanceMeters = dataRota.routes[0].distance;
          // Distância em km (multiplicado por 2 para ida e volta)
          const distKm = (distanceMeters / 1000) * 2;
          
          const frete = Math.max(
            state.frete.minimo || 10,
            (state.frete.custo || 1.59) * distKm / (1 - (state.frete.margemPct || 25) / 100)
          );

          state.frete.distanciaKm = parseFloat(distKm.toFixed(1));
          state.frete.valorFrete = parseFloat(frete.toFixed(2));
          renderStep();
          showToast(`✅ Frete calculado: ${fmt(frete)}`);
        } else {
          throw new Error('Nenhuma rota encontrada entre os locais.');
        }
      } catch (e) {
        console.error("Erro na API OpenStreetMap/OSRM:", e);
        showToast('❌ Erro: ' + (e.message || 'Falha ao calcular.'));
      } finally {
        btn.textContent = '🗺️ Calcular distância (Automático)';
        btn.classList.remove('loading-btn');
      }
    }

    /* ---- Navigation ---- */
    document.getElementById('btn-next').addEventListener('click', () => {

    document.getElementById('btn-prev').addEventListener('click', () => {

      const dataFmt = ev.data ? new Date(ev.data + 'T00:00').toLocaleDateString('pt-BR') : '—';
      const total = valorFinal();

      let itens = state.produtos.map(p => `• ${p.qtd || 1}x ${p.nome || 'Item'}${p.obs ? ` (${p.obs})` : ''}`).join('\n');

      const msg = `🌼 *Proposta de Orçamento — Warner Flores* 🌼\n\n*Dados do Cliente*\nNome: ${cl.nome || '—'}\nTelefone: ${cl.whatsapp || '—'}\nEndereço do Evento:\n${ev.endereco || '—'}\nData do Evento: ${dataFmt}\nHora do Evento: ${ev.hora || '—'}\nForma de Pagamento: ${pg.metodo}\n\n*Itens do Orçamento*\n${itens}\n\n*VALOR FINAL: ${fmt(total)}*\n\nValor incluso: mão de obra, entrega e instalação.`;

      navigator.clipboard.writeText(msg).then(() => {
        showToast('✅ Mensagem copiada!');
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = msg; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('✅ Mensagem copiada!');
      });
    }
